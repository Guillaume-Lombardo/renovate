stages:
  - validate
  - build

variables:
  RENOVATE_TOKEN: "ci-placeholder"
  GITHUB_COM_TOKEN: ""
  RENOVATE_GIT_AUTHOR: "Renovate Bot <plain.rose9051@fastmail.com>"
  RENOVATE_AUTODISCOVER_FILTER: "g1lom/*"
  RENOVATE_RUN_INTERVAL_SECONDS: "21600"
  LOG_LEVEL: "info"

validate_yaml:
  stage: validate
  image:
    name: pipelinecomponents/yamllint:0.35.0
    entrypoint: [""]
  script:
    - |
      set -eu
      files="$(find . \
        -path './.git' -prune -o \
        -type f \( -name '*.yaml' -o -name '*.yml' -o -name '.yamllint' \) \
        -print)"
      [ -n "$files" ] || exit 0
      yamllint $files

validate_json:
  stage: validate
  image: node:24-alpine
  script:
    - |
      set -eu
      files="$(find . \
        -path './.git' -prune -o \
        -type f -name '*.json' \
        -print)"
      [ -n "$files" ] || exit 0
      for file in $files; do
        node -e "JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8'))" "$file"
      done

validate_dockerfiles:
  stage: validate
  image:
    name: hadolint/hadolint:v2.12.0-alpine
    entrypoint: [""]
  script:
    - |
      set -eu
      files="$(find . \
        -path './.git' -prune -o \
        -type f \( -name 'Dockerfile' -o -name '*.Dockerfile' -o -name 'Dockerfile.*' \) \
        -print)"
      [ -n "$files" ] || exit 0
      hadolint $files

validate_compose:
  stage: validate
  image: docker:28-cli
  before_script:
    - apk add --no-cache docker-cli-compose
  script:
    - |
      set -eu
      files="$(find . \
        -path './.git' -prune -o \
        -type f \( \
          -name 'compose.yaml' -o \
          -name 'compose.yml' -o \
          -name 'docker-compose.yaml' -o \
          -name 'docker-compose.yml' \
        \) \
        -print)"
      [ -n "$files" ] || exit 0
      for file in $files; do
        docker compose -f "$file" config --quiet
      done

validate_renovate_config:
  stage: validate
  image:
    name: renovate/renovate:latest
    entrypoint: [""]
  script:
    - node --check config.js
    - renovate-config-validator --no-global renovate.json
    - renovate-config-validator config.js

validate_shell:
  stage: validate
  image: alpine:3.22
  before_script:
    - apk add --no-cache shellcheck
  script:
    - sh -n scripts/*.sh
    - shellcheck scripts/*.sh

build_image:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.24.0-debug
    entrypoint: [""]
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - when: never
  script:
    - /kaniko/executor
      --context "$CI_PROJECT_DIR"
      --dockerfile "$CI_PROJECT_DIR/Dockerfile"
      --destination "$CI_REGISTRY_IMAGE:latest"
      --destination "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
